exp_id: e17_convnext_base_ema_fullaug
description: 'Robustness check at full scale - final CNN (ConvNeXt-B IN-22k 384 px
  + EMA) with the full regularisation package: strong aug (RandAugment + RandomErasing)
  + MixUp/CutMix (50% of batches) + label smoothing 0.1; same 30 epochs'
seed: 42
save_ckpt: true
data:
  train_txt: dataset/train.txt
  test_txt: dataset/test.txt
  train_dir: dataset/Train
  test_dir: dataset/Test
  img_size: 384
  crop_pct: 0.875
  aug: strong
  subset: null
  num_workers: 3
model:
  name: convnext_base.fb_in22k_ft_in1k_384
  pretrained: true
  num_classes: 200
  dropout: 0.0
  drop_path: 0.0
  pooling: avg
  grad_ckpt: true
train:
  epochs: 30
  warmup_epochs: 3
  batch_size: 8
  accum_steps: 2
  eval_batch_size: 16
  optimizer: adamw
  strategy: full
  lr: 5.0e-05
  head_lr: 0.0005
  weight_decay: 0.05
  momentum: 0.9
  label_smoothing: 0.1
  mixup: 0.8
  cutmix: 1.0
  min_lr_ratio: 0.01
  amp: true
  clip_grad: null
  eval_every: 1
  ema_decay: 0.999
  mix_prob: 0.5
git: 175a4a7
