exp_id: e4_adam
description: Optimizer study - Adam (coupled L2 weight decay 1e-4), same LRs as AdamW
  (1e-4 / 1e-3)
seed: 42
save_ckpt: true
data:
  train_txt: dataset/train.txt
  test_txt: dataset/test.txt
  train_dir: dataset/Train
  test_dir: dataset/Test
  img_size: 224
  crop_pct: 0.875
  aug: basic
  subset: null
  num_workers: 4
model:
  name: convnext_tiny.fb_in1k
  pretrained: true
  num_classes: 200
  dropout: 0.0
  drop_path: 0.0
  pooling: avg
  grad_ckpt: false
train:
  epochs: 30
  warmup_epochs: 3
  batch_size: 32
  accum_steps: 1
  eval_batch_size: 64
  optimizer: adam
  strategy: full
  lr: 0.0001
  head_lr: 0.001
  weight_decay: 0.0001
  momentum: 0.9
  label_smoothing: 0.0
  mixup: 0.0
  cutmix: 0.0
  min_lr_ratio: 0.01
  amp: true
  clip_grad: null
  eval_every: 1
git: e36a57a
