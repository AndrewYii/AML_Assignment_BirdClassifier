exp_id: e18_swin_base_22k_384_ema
description: 'Fair large-scale CNN vs Transformer: Swin-B (88M, ImageNet-22k -> 1k
  at 384 px) with EXACTLY the final ConvNeXt-B recipe (384 px, EMA, LR 5e-5/5e-4,
  batch 8x2, 30 epochs); only the backbone changes'
seed: 42
save_ckpt: true
data:
  train_txt: dataset/train.txt
  test_txt: dataset/test.txt
  train_dir: dataset/Train
  test_dir: dataset/Test
  img_size: 384
  crop_pct: 0.875
  aug: basic
  subset: null
  num_workers: 3
model:
  name: swin_base_patch4_window12_384.ms_in22k_ft_in1k
  pretrained: true
  num_classes: 200
  dropout: 0.0
  drop_path: 0.0
  pooling: avg
  grad_ckpt: true
train:
  epochs: 30
  warmup_epochs: 3
  batch_size: 8
  accum_steps: 2
  eval_batch_size: 16
  optimizer: adamw
  strategy: full
  lr: 5.0e-05
  head_lr: 0.0005
  weight_decay: 0.05
  momentum: 0.9
  label_smoothing: 0.0
  mixup: 0.0
  cutmix: 0.0
  min_lr_ratio: 0.01
  amp: true
  clip_grad: null
  eval_every: 1
  ema_decay: 0.999
