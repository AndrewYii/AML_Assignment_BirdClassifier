exp_id: e6c_mixup_cutmix
description: Regularisation (alone) - MixUp(alpha 0.8) / CutMix(alpha 1.0), applied
  to 50% of batches
seed: 42
save_ckpt: true
data:
  train_txt: dataset/train.txt
  test_txt: dataset/test.txt
  train_dir: dataset/Train
  test_dir: dataset/Test
  img_size: 224
  crop_pct: 0.875
  aug: basic
  subset: null
  num_workers: 4
model:
  name: convnext_tiny.fb_in1k
  pretrained: true
  num_classes: 200
  dropout: 0.0
  drop_path: 0.0
  pooling: avg
  grad_ckpt: false
train:
  epochs: 30
  warmup_epochs: 3
  batch_size: 16
  accum_steps: 1
  eval_batch_size: 64
  optimizer: adamw
  strategy: full
  lr: 5.0e-05
  head_lr: 0.0005
  weight_decay: 0.05
  momentum: 0.9
  label_smoothing: 0.0
  mixup: 0.8
  cutmix: 1.0
  min_lr_ratio: 0.01
  amp: true
  clip_grad: null
  eval_every: 1
  mix_prob: 0.5
git: 7c96e68
